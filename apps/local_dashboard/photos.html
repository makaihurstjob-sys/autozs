<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AutoZS - Photo Review</title>
    <style>
      :root {
        --bg: #0e1512;
        --panel: #16211d;
        --panel-2: #1e2c26;
        --line: #2a3d35;
        --text: #eaf3ef;
        --muted: #9ab5aa;
        --accent: #55b7a7;
        --yes: #34c98a;
        --no: #ef5f6b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        flex: 0 0 auto;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 700; }
      header .sub { color: var(--muted); font-size: 12px; }
      .spacer { flex: 1; }
      .pill {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 12px;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }

      main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 14px;
        min-height: 0;
      }
      #deck {
        position: relative;
        width: min(420px, 92vw);
        aspect-ratio: 3 / 4;
        max-height: 64vh;
        flex: 0 1 auto;
        min-height: 0;
      }
      .card {
        position: absolute;
        inset: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
        will-change: transform;
      }
      .card.behind { transform: scale(0.94) translateY(14px); opacity: 0.55; }
      .card.animate { transition: transform 0.32s ease, opacity 0.32s ease; }
      .card img {
        width: 100%;
        flex: 1 1 auto;
        object-fit: contain;
        background: #0b100e;
        min-height: 0;
        pointer-events: none;
      }
      .card .meta {
        flex: 0 0 auto;
        padding: 9px 12px;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tag {
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid var(--line);
      }
      .tag.review { color: #b9e2ff; border-color: #2b4f66; }
      .tag.variation { color: #ffd9a8; border-color: #6b512b; }
      .stamp {
        position: absolute;
        top: 20px;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 6px 14px;
        border: 4px solid;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
      }
      .stamp.yes { left: 18px; color: var(--yes); border-color: var(--yes); transform: rotate(-14deg); }
      .stamp.no { right: 18px; color: var(--no); border-color: var(--no); transform: rotate(14deg); }

      #variants {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 2px 8px;
        width: min(560px, 96vw);
        flex: 0 0 auto;
        scrollbar-width: thin;
      }
      .chip {
        flex: 0 0 auto;
        width: 66px;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        padding: 4px;
        text-align: center;
        cursor: pointer;
      }
      .chip img {
        width: 100%;
        height: 52px;
        object-fit: cover;
        border-radius: 8px;
        background: #0b100e;
        display: block;
      }
      .chip span {
        display: block;
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip.selected { border-color: var(--accent); }
      .chip.selected span { color: var(--text); font-weight: 700; }
      #variants.nudge { animation: nudge 0.4s ease; }
      @keyframes nudge {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-7px); }
        75% { transform: translateX(7px); }
      }
      .actions { display: flex; gap: 12px; align-items: center; flex: 0 0 auto; }
      .round {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        font-size: 22px;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .round.no { color: var(--no); border-color: #5c2a2f; }
      .round.yes { color: var(--yes); border-color: #235c45; }
      #hint { color: var(--muted); font-size: 12px; text-align: center; min-height: 16px; flex: 0 0 auto; }
      #empty { text-align: center; color: var(--muted); padding: 26px; display: none; }
      #empty h2 { color: var(--text); }
      #picker { display: none; width: min(720px, 96vw); overflow-y: auto; max-height: 100%; }
      .queue-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        margin-bottom: 8px;
        text-decoration: none;
        color: inherit;
      }
      .queue-row:hover { border-color: var(--accent); }
      .queue-row img {
        width: 54px; height: 54px; object-fit: cover; border-radius: 9px;
        background: var(--panel-2); flex: 0 0 auto;
      }
      .queue-row .t { flex: 1; min-width: 0; }
      .queue-row .t b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .queue-row .t span { font-size: 11px; color: var(--muted); }
      .badge {
        flex: 0 0 auto; border-radius: 999px; padding: 4px 10px;
        font-size: 11px; font-weight: 700; border: 1px solid var(--line);
      }
      .badge.todo { color: var(--accent); border-color: var(--accent); }
      .badge.done { color: var(--muted); }
      a { color: var(--accent); }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f2f6f4; --panel: #ffffff; --panel-2: #eef3f1; --line: #d5e2dc;
          --text: #16211d; --muted: #5c7168;
        }
        .card img, .chip img { background: #f2f6f4; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 id="product-title">Photo review</h1>
        <div class="sub" id="product-sub">Loading...</div>
      </div>
      <div class="spacer"></div>
      <div class="pill" id="counter">-</div>
      <button id="undo" disabled>Undo</button>
    </header>

    <main>
      <div id="deck"></div>
      <div id="variants"></div>
      <div class="actions">
        <button class="round no" id="btn-no" title="Reject (left arrow)">&#10005;</button>
        <button class="round yes" id="btn-yes" title="Approve (right arrow)">&#10003;</button>
      </div>
      <div id="hint"></div>
      <div id="empty">
        <h2>All caught up</h2>
        <p>Every photo for this product has been reviewed.</p>
        <p id="empty-detail"></p>
        <p><a href="photos.html">Back to all products</a></p>
      </div>
      <div id="picker"></div>
    </main>

    <script>
      const API_STORAGE_KEY = "ebayAutomationApiBaseUrl";
      const params = new URLSearchParams(location.search);
      const normalizeApiBaseUrl = (value) => String(value || "").trim().replace(/\/+$/, "");
      function defaultApiBaseUrl() {
        if (["localhost", "127.0.0.1", ""].includes(location.hostname)) {
          return `http://${location.hostname || "127.0.0.1"}:8000`;
        }
        return "";
      }
      const API = normalizeApiBaseUrl(
        params.get("api") || localStorage.getItem(API_STORAGE_KEY) || defaultApiBaseUrl()
      );
      const productId = Number(params.get("product_id") || 0);

      const deck = document.getElementById("deck");
      const chipsEl = document.getElementById("variants");
      const counterEl = document.getElementById("counter");
      const hintEl = document.getElementById("hint");
      const emptyEl = document.getElementById("empty");
      const undoBtn = document.getElementById("undo");

      let queue = [];
      let variants = [];
      let selectedVariantId = null;
      let total = 0;
      let done = 0;
      let history = [];
      let busy = false;

      const api = async (path, options) => {
        const response = await fetch(API + path, options);
        if (!response.ok) throw new Error((await response.text()).slice(0, 200));
        return response.json();
      };

      async function loadPicker() {
        const queue = await api("/depop/photo-queue");
        document.getElementById("product-title").textContent = "Photo review";
        document.getElementById("product-sub").textContent = queue.length
          ? `${queue.filter((item) => item.pending).length} product(s) waiting`
          : "Nothing captured yet";
        counterEl.style.display = "none";
        undoBtn.style.display = "none";
        deck.style.display = "none";
        chipsEl.style.display = "none";
        document.querySelector(".actions").style.display = "none";
        const picker = document.getElementById("picker");
        picker.style.display = "block";
        document.querySelector("main").style.justifyContent = "flex-start";
        if (!queue.length) {
          picker.innerHTML =
            '<p style="text-align:center;color:var(--muted)">Import an Amazon listing to queue up its variations and review photos.</p>';
          return;
        }
        picker.innerHTML = "";
        for (const item of queue) {
          const row = document.createElement("a");
          row.className = "queue-row";
          row.href = `photos.html?product_id=${item.product_id}${params.get("api") ? `&api=${encodeURIComponent(params.get("api"))}` : ""}`;
          const img = document.createElement("img");
          img.src = amazonSized(item.cover_image, 120);
          img.alt = "";
          const text = document.createElement("div");
          text.className = "t";
          const name = document.createElement("b");
          name.textContent = item.product_title;
          const sub = document.createElement("span");
          sub.textContent = `${item.variants} variation(s) - ${item.approved} approved, ${item.rejected} rejected`;
          text.append(name, sub);
          const badge = document.createElement("span");
          badge.className = `badge ${item.pending ? "todo" : "done"}`;
          badge.textContent = item.pending ? `${item.pending} to review` : "done";
          row.append(img, text, badge);
          picker.append(row);
        }
      }

      async function load() {
        if (!productId) {
          await loadPicker();
          return;
        }
        const data = await api(`/depop/photo-review/${productId}`);
        variants = data.variants;
        allVariationPhotos = data.photos.filter((p) => p.kind === "variation");
        // Variation photos already know their colour, so only the unattributed
        // review photos need a human decision.
        const reviewPhotos = data.photos.filter((p) => p.kind === "review");
        queue = reviewPhotos.filter((p) => p.status === "pending");
        done = reviewPhotos.length - queue.length;
        total = reviewPhotos.length;
        document.getElementById("product-title").textContent = (data.product_title || `Product ${productId}`).slice(0, 64);
        document.getElementById("product-sub").textContent =
          `${variants.length} variation(s) - swipe review photos onto a colour`;
        renderChips();
        render();
      }

      /** Amazon renders any stored size on demand, so ask for a crisp chip-sized
       *  copy instead of scaling a 40px thumbnail up or a 1500px original down. */
      function amazonSized(url, size) {
        return String(url || "").replace(/(\/images\/I\/[^./]+)(\._[^.]+_)?\.(jpg|jpeg|png)$/i, `$1._SS${size}_.$3`);
      }

      function variantImage(variant) {
        const match = allVariationPhotos.find((p) => p.variant_id === variant.id);
        return match ? amazonSized(match.image_url, 200) : "";
      }

      let allVariationPhotos = [];

      function renderChips() {
        chipsEl.innerHTML = "";
        variants.forEach((variant, index) => {
          const chip = document.createElement("button");
          chip.className = "chip" + (variant.id === selectedVariantId ? " selected" : "");
          chip.title = `${variant.color} (press ${index + 1})`;
          const img = document.createElement("img");
          img.src = variantImage(variant);
          img.alt = variant.color;
          const label = document.createElement("span");
          label.textContent = variant.color || variant.variant_key;
          chip.append(img, label);
          chip.addEventListener("click", () => {
            selectedVariantId = variant.id;
            renderChips();
            updateHint();
          });
          chipsEl.append(chip);
        });
      }

      function updateHint() {
        if (!queue.length) return;
        const variant = variants.find((v) => v.id === selectedVariantId);
        hintEl.textContent = variant
          ? `Swipe right to approve into "${variant.color}"`
          : "Pick a variation below, then swipe right to approve";
      }

      function render() {
        deck.innerHTML = "";
        counterEl.textContent = total ? `${done} / ${total} reviewed` : "no review photos";
        undoBtn.disabled = !history.length;
        if (!queue.length) {
          emptyEl.style.display = "block";
          document.querySelector(".actions").style.display = "none";
          chipsEl.style.display = "none";
          hintEl.textContent = "";
          document.getElementById("empty-detail").textContent = total
            ? `${total} review photo(s) decided.`
            : "This product has no customer review photos.";
          return;
        }
        emptyEl.style.display = "none";
        document.querySelector(".actions").style.display = "flex";
        chipsEl.style.display = "flex";
        const next = queue[1];
        if (next) deck.append(makeCard(next, true));
        deck.append(makeCard(queue[0], false));
        updateHint();
      }

      function makeCard(photo, behind) {
        const card = document.createElement("div");
        card.className = "card" + (behind ? " behind" : "");
        const img = document.createElement("img");
        img.src = photo.image_url;
        img.alt = "";
        img.loading = "eager";
        img.addEventListener("error", () => {
          img.src = photo.thumb_url || "";
        });
        const meta = document.createElement("div");
        meta.className = "meta";
        const tag = document.createElement("span");
        tag.className = `tag ${photo.kind}`;
        tag.textContent = photo.kind;
        const text = document.createElement("span");
        text.textContent = photo.width && photo.height ? `${photo.width}x${photo.height}` : "customer photo";
        meta.append(tag, text);
        const yes = document.createElement("div");
        yes.className = "stamp yes";
        yes.textContent = "KEEP";
        const no = document.createElement("div");
        no.className = "stamp no";
        no.textContent = "NOPE";
        card.append(img, meta, yes, no);
        if (!behind) attachDrag(card);
        return card;
      }

      function attachDrag(card) {
        let startX = 0;
        let startY = 0;
        let dx = 0;
        let dragging = false;
        const yes = card.querySelector(".stamp.yes");
        const no = card.querySelector(".stamp.no");

        const down = (event) => {
          if (busy) return;
          dragging = true;
          card.classList.remove("animate");
          const point = event.touches ? event.touches[0] : event;
          startX = point.clientX;
          startY = point.clientY;
        };
        const move = (event) => {
          if (!dragging) return;
          const point = event.touches ? event.touches[0] : event;
          dx = point.clientX - startX;
          const dy = point.clientY - startY;
          card.style.transform = `translate(${dx}px, ${dy * 0.25}px) rotate(${dx / 22}deg)`;
          yes.style.opacity = dx > 0 ? Math.min(1, dx / 110) : 0;
          no.style.opacity = dx < 0 ? Math.min(1, -dx / 110) : 0;
          if (event.cancelable) event.preventDefault();
        };
        const up = () => {
          if (!dragging) return;
          dragging = false;
          if (Math.abs(dx) > 95) {
            decide(dx > 0 ? "approved" : "rejected");
          } else {
            card.classList.add("animate");
            card.style.transform = "";
            yes.style.opacity = 0;
            no.style.opacity = 0;
          }
          dx = 0;
        };

        card.addEventListener("mousedown", down);
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
        card.addEventListener("touchstart", down, { passive: true });
        card.addEventListener("touchmove", move, { passive: false });
        card.addEventListener("touchend", up);
      }

      function flyOut(direction) {
        const card = deck.lastElementChild;
        if (!card) return;
        card.classList.add("animate");
        card.style.transform = `translate(${direction * window.innerWidth}px, 0) rotate(${direction * 28}deg)`;
        card.style.opacity = "0";
      }

      async function decide(status) {
        if (busy || !queue.length) return;
        if (status === "approved" && !selectedVariantId) {
          // Approving is also an assignment, so refuse until a colour is chosen.
          chipsEl.classList.remove("nudge");
          void chipsEl.offsetWidth;
          chipsEl.classList.add("nudge");
          hintEl.textContent = "Pick which variation this photo belongs to first.";
          const card = deck.lastElementChild;
          if (card) {
            card.classList.add("animate");
            card.style.transform = "";
            card.querySelectorAll(".stamp").forEach((s) => (s.style.opacity = 0));
          }
          return;
        }
        busy = true;
        const photo = queue[0];
        const variantId = status === "approved" ? selectedVariantId : null;
        flyOut(status === "approved" ? 1 : -1);
        try {
          await api(`/depop/source-photos/${photo.id}/decision`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status, variant_id: variantId }),
          });
          history.push({ photo, status, variantId });
          queue.shift();
          done += 1;
        } catch (error) {
          hintEl.textContent = `Could not save: ${error.message}`;
        } finally {
          setTimeout(() => {
            busy = false;
            render();
          }, 240);
        }
      }

      async function undo() {
        const last = history.pop();
        if (!last) return;
        busy = true;
        try {
          await api(`/depop/source-photos/${last.photo.id}/decision`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: "pending", variant_id: null }),
          });
          queue.unshift(last.photo);
          done = Math.max(0, done - 1);
        } catch (error) {
          hintEl.textContent = `Undo failed: ${error.message}`;
        } finally {
          busy = false;
          render();
        }
      }

      document.getElementById("btn-yes").addEventListener("click", () => decide("approved"));
      document.getElementById("btn-no").addEventListener("click", () => decide("rejected"));
      undoBtn.addEventListener("click", undo);
      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") decide("approved");
        else if (event.key === "ArrowLeft") decide("rejected");
        else if (event.key.toLowerCase() === "u") undo();
        else if (/^[1-9]$/.test(event.key)) {
          const variant = variants[Number(event.key) - 1];
          if (variant) {
            selectedVariantId = variant.id;
            renderChips();
            updateHint();
          }
        }
      });

      (async () => {
        try {
          await load();
        } catch (error) {
          hintEl.textContent = `Failed to load: ${error.message}`;
        }
      })();
    </script>
  </body>
</html>
