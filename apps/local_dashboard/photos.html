<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AutoZS - Photo Review</title>
    <style>
      :root {
        --bg: #0e1512;
        --panel: #16211d;
        --panel-2: #1e2c26;
        --line: #2a3d35;
        --text: #eaf3ef;
        --muted: #9ab5aa;
        --accent: #55b7a7;
        --yes: #34c98a;
        --no: #ef5f6b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        flex: 0 0 auto;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 700; }
      header .sub { color: var(--muted); font-size: 12px; }
      .spacer { flex: 1; }
      .pill {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 12px;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }

      main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 14px;
        min-height: 0;
      }
      #deck {
        position: relative;
        width: min(420px, 92vw, 58vh);
        height: min(420px, 92vw, 58vh);
        aspect-ratio: 1 / 1;
        flex: 0 0 auto;
        min-height: 0;
      }
      .card {
        position: absolute;
        inset: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
        will-change: transform;
      }
      .card.behind { transform: scale(0.94) translateY(14px); opacity: 0.55; }
      .card.animate { transition: transform 0.32s ease, opacity 0.32s ease; }
      .card img {
        position: absolute;
        left: 50%;
        top: 50%;
        max-width: none;
        max-height: none;
        background: #0b100e;
        touch-action: none;
        cursor: grab;
      }
      .card img.adjusting { cursor: grabbing; }
      .card .meta {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        background: rgba(14, 21, 18, .9);
        flex: 0 0 auto;
        padding: 9px 12px;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tag {
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid var(--line);
      }
      .tag.review { color: #b9e2ff; border-color: #2b4f66; }
      .tag.variation { color: #ffd9a8; border-color: #6b512b; }
      .stamp {
        position: absolute;
        top: 20px;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 6px 14px;
        border: 4px solid;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
      }
      .stamp.yes { left: 18px; color: var(--yes); border-color: var(--yes); transform: rotate(-14deg); }
      .stamp.no { right: 18px; color: var(--no); border-color: var(--no); transform: rotate(14deg); }

      #variants {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 2px 8px;
        width: min(560px, 96vw);
        flex: 0 0 auto;
        scrollbar-width: thin;
      }
      .chip {
        flex: 0 0 auto;
        width: 66px;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        padding: 4px;
        text-align: center;
        cursor: pointer;
      }
      .chip img {
        width: 100%;
        height: 52px;
        object-fit: cover;
        border-radius: 8px;
        background: #0b100e;
        display: block;
      }
      .chip span {
        display: block;
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip.selected { border-color: var(--accent); }
      .chip.selected span { color: var(--text); font-weight: 700; }
      #variants.nudge { animation: nudge 0.4s ease; }
      @keyframes nudge {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-7px); }
        75% { transform: translateX(7px); }
      }
      .actions { display: flex; gap: 12px; align-items: center; flex: 0 0 auto; }
      .crop-controls { display: none; align-items: center; gap: 10px; width: min(420px, 92vw); }
      .crop-controls.visible { display: flex; }
      .crop-controls input { flex: 1; accent-color: var(--accent); }
      #crop-toggle.active { color: var(--accent); border-color: var(--accent); }
      #expand-toggle.active { color: var(--accent); border-color: var(--accent); }
      #ai-expand { font-size: 11px; }
      #ai-expand:disabled { opacity: 0.4; }
      .card img.blur-backdrop {
        inset: -8%;
        left: -8%;
        top: -8%;
        width: 116%;
        height: 116%;
        transform: none;
        object-fit: cover;
        filter: blur(18px) brightness(.72);
        display: none;
      }
      .card img.photo.expand {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: translate(-50%, -50%);
      }
      .round {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        font-size: 22px;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .round.no { color: var(--no); border-color: #5c2a2f; }
      .round.yes { color: var(--yes); border-color: #235c45; }
      #hint { color: var(--muted); font-size: 12px; text-align: center; min-height: 16px; flex: 0 0 auto; }
      #empty { text-align: center; color: var(--muted); padding: 26px; display: none; }
      #empty h2 { color: var(--text); }
      #picker { display: none; width: min(720px, 96vw); overflow-y: auto; max-height: 100%; }
      .queue-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        margin-bottom: 8px;
        text-decoration: none;
        color: inherit;
      }
      .queue-row:hover { border-color: var(--accent); }
      .queue-row img {
        width: 54px; height: 54px; object-fit: cover; border-radius: 9px;
        background: var(--panel-2); flex: 0 0 auto;
      }
      .queue-row .t { flex: 1; min-width: 0; }
      .queue-row .t b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .queue-row .t span { font-size: 11px; color: var(--muted); }
      .badge {
        flex: 0 0 auto; border-radius: 999px; padding: 4px 10px;
        font-size: 11px; font-weight: 700; border: 1px solid var(--line);
      }
      .badge.todo { color: var(--accent); border-color: var(--accent); }
      .badge.done { color: var(--muted); }
      a { color: var(--accent); }
      html[data-embedded="true"] {
        --bg: #11080a;
        --panel: #1d0d11;
        --panel-2: #2a1117;
        --line: #51202b;
        --text: #fff1f3;
        --muted: #d5aab3;
        --accent: #e85c72;
      }
      html[data-embedded="true"],
      html[data-embedded="true"] body { background: var(--bg); color-scheme: dark; }
      html[data-embedded="true"] header { padding: 9px 12px; }
      html[data-embedded="true"] main { padding: 10px; gap: 10px; overflow-y: auto; justify-content: flex-start; }
      html[data-embedded="true"] #deck { width: min(420px, 94vw, 46vh); height: min(420px, 94vw, 46vh); }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f2f6f4; --panel: #ffffff; --panel-2: #eef3f1; --line: #d5e2dc;
          --text: #16211d; --muted: #5c7168;
        }
        .card img, .chip img { background: #f2f6f4; }
      }
    </style>
  <link rel="stylesheet" href="photo-compact.css" />
</head>
  <body>
    <header>
      <a id="review-products" href="photos.html" aria-label="Back to review products">&#8249;</a>
      <div>
        <h1 id="product-title">Photo review</h1>
        <div class="sub" id="product-sub">Loading...</div>
      </div>
      <div class="spacer"></div>
      <div class="pill" id="counter">-</div>
      <button id="undo" disabled>Undo</button>
    </header>

    <main>
      <div id="photo-readiness" role="status" aria-live="polite" hidden></div>
      <div id="deck"></div>
      <div class="crop-toolbar"><button id="square-crop" type="button" aria-pressed="true">Square crop</button><button id="crop-toggle" type="button">Adjust crop</button></div>
      <div class="crop-controls" id="crop-controls"><span>?</span><input id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="Crop zoom" /><span>+</span></div>
      <button id="all-colors" type="button">Choose color &middot; See all</button><div id="variants"></div>
      <div class="actions">
        <button class="round no" id="btn-no" title="Reject (left arrow)">&#10005; Reject</button>
        <button id="expand-toggle" type="button">Expand background</button>
        <button id="ai-expand" type="button" disabled title="Experimental: blocked until OAuth generation supports pixel-locked masking">AI Expand · experimental</button>
        <button class="round yes" id="btn-yes" title="Approve (right arrow)">&#10003; Approve</button>
      </div>
      <div id="hint"></div>
      <div id="empty">
        <h2>All caught up</h2>
        <p>Every photo for this product has been reviewed.</p>
        <p id="empty-detail"></p>
        <p><a href="photos.html" id="back-to-products">Back to all products</a></p>
      </div>
      <div id="picker"></div>
    </main>

    <script src="photo-review.js"></script><script>mountPhotoReview(document.body);</script>
</body></html>
